mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .470/.480/.500), so this
# repo's own version no longer needs to track CluedIn. Started at 100.0 (not 1.0) so customers who
# saw this repo at 4.x/5.x under the old single-version scheme never see it "go backwards" to 1.x
# under the new one. Unlike the original 1.0 reset, no commits-before/ignore trick is needed here -
# GitVersion's next-version only needs help overriding an existing tag when the new value is LOWER
# than that tag; 100.0 is already higher than every pre-existing tag, so it wins on its own
# (verified via a real local `dotnet-gitversion` run).
next-version: 100.0
branches:
  master:
    mode: ContinuousDelivery
  pull-request:
    tag: pr
    increment: None
  develop:
    tag: alpha
  hotfix:
    tag: useBranchName
  ama:
    increment: None
    tracks-release-branches: false
    regex: ^ama[/-]
    is-release-branch: false
    mode: ContinuousDeployment
    track-merge-target: false
    tag: ama
    pre-release-weight: 30000
    prevent-increment-of-merged-branch-version: true
    is-mainline: false
    source-branches:
    - main
    - develop

